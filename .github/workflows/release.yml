name: Release

# Run from the Actions tab. Releases the version in Cargo.toml as tag v<version>,
# built from the commit the workflow is started on.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: false
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/continuous

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Check that this version is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          # An annotated tag lists its commit on the peeled (^{}) line, which sorts last.
          tagged=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG already exists on $tagged, not on $GITHUB_SHA. Bump the version in Cargo.toml first."
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runtime: x86_64
          - target: aarch64-unknown-linux-musl
            runtime: aarch64
          - target: armv7-unknown-linux-musleabihf
            runtime: armhf
          - target: i686-unknown-linux-musl
            runtime: i686
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Static musl binaries with no C dependencies, so the bundled rust-lld can
      # link every architecture without a cross toolchain.
      - name: Build
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Fetch appimagetool
        run: |
          # appimagetool refuses to run without desktop-file-validate.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/runtime" "$APPIMAGE_RUNTIME_URL/runtime-${{ matrix.runtime }}"
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_RUNTIME: ${{ runner.temp }}/runtime
        run: scripts/package.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The body of this version's section in CHANGELOG.md, if it has one.
          awk -v v="$VERSION" '
            /^## / { found = ($2 == v); next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          args=(--target "$GITHUB_SHA" --title "magicpen $TAG")
          if [ -s notes.md ]; then
            args+=(--notes-file notes.md)
          else
            args+=(--generate-notes)
          fi
          if [ "${{ inputs.draft }}" = true ]; then args+=(--draft); fi
          if [ "${{ inputs.prerelease }}" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/*
